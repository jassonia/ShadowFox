<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>E-Commerce Management System</title>

    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #4facfe,
                #00f2fe
            );

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .container {

            background: white;

            width: 90%;

            max-width: 900px;

            padding: 50px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h1 {

            font-size: 45px;

            margin-bottom: 15px;

            color: #222;
        }

        p {

            font-size: 18px;

            color: #555;

            margin-bottom: 40px;
        }

        .button-box {

            display: flex;

            justify-content: center;

            gap: 30px;

            flex-wrap: wrap;
        }

        .card {

            width: 280px;

            padding: 35px;

            border-radius: 20px;

            color: white;

            cursor: pointer;

            transition: 0.3s;

            text-decoration: none;
        }

        .card:hover {

            transform: translateY(-8px);
        }

        .admin {

            background: linear-gradient(
                135deg,
                #007bff,
                #00c6ff
            );
        }

        .customer {

            background: linear-gradient(
                135deg,
                #ff9800,
                #ff5722
            );
        }

        .card h2 {

            margin-bottom: 15px;

            font-size: 30px;
        }

        .card p {

            color: white;

            font-size: 16px;
        }

        @media(max-width: 768px) {

            .button-box {

                flex-direction: column;

                align-items: center;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>E-Commerce Management System</h1>

        <p>
            Smart Product • Inventory • Order Management
        </p>

        <div class="button-box">

            <a
                href="admin.html"
                class="card admin"
            >

                <h2>Admin Panel</h2>

                <p>
                    Manage products,
                    stock and inventory
                </p>

            </a>

            <a
                href="customer.html"
                class="card customer"
            >

                <h2>Customer Store</h2>

                <p>
                    Browse products
                    and place orders
                </p>

            </a>

        </div>

    </div>

</body>

</html>
