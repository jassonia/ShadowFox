<!DOCTYPE html>

<html>

<head>

```
<meta charset="UTF-8">

<title>Payment Gateway</title>

<link rel="stylesheet" href="payment.css">
```

</head>

<body>

```
<div class="container">

    <h1>Payment Gateway</h1>

    <h2>Select Payment Method</h2>

    <input
    type="radio"
    name="payment"
    value="UPI"
    onclick="showFields()"
    >
    UPI

    <br><br>

    <input
    type="radio"
    name="payment"
    value="Credit Card"
    onclick="showFields()"
    >
    Credit Card

    <br><br>

    <input
    type="radio"
    name="payment"
    value="Debit Card"
    onclick="showFields()"
    >
    Debit Card

    <br><br>

    <input
    type="radio"
    name="payment"
    value="Cash On Delivery"
    onclick="showFields()"
    >
    Cash On Delivery

    <br><br>

    <!-- UPI SECTION -->

    <div
    id="upiSection"
    style="display:none;"
    >

        <input
        type="text"
        id="upiId"
        placeholder="Enter UPI ID"
        >

        <br><br>

    </div>

    <!-- CARD SECTION -->

    <div
    id="cardSection"
    style="display:none;"
    >

        <input
        type="text"
        id="cardNumber"
        placeholder="Card Number"
        >

        <br><br>

        <input
        type="text"
        id="cardHolder"
        placeholder="Card Holder Name"
        >

        <br><br>

        <input
        type="month"
        id="expiry"
        >

        <br><br>

        <input
        type="password"
        id="cvv"
        placeholder="CVV"
        >

        <br><br>

    </div>

    <!-- COD SECTION -->

    <div
    id="codSection"
    style="display:none;"
    >

        <p>
            Pay when product is delivered.
        </p>

        <br>

    </div>

    <button
    onclick="payNow()"
    >
        Pay Now
    </button>

</div>

<script src="payment.js"></script>
```

</body>

</html>
